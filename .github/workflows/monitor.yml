name: Robo Cruzeiro

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: robo-cruzeiro
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Procurar anuncios
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar anuncios ja vistos
        if: always()
        run: |
          git config user.name "robo-cruzeiro"
          git config user.email "robo-cruzeiro@users.noreply.github.com"
          git add vistos.json || true
          git diff --cached --quiet || git commit -m "atualiza anuncios vistos"
          git pull --rebase --autostash || true
          git push || true
